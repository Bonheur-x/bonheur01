    <link href="https://fonts.googleapis.com/css2?family=Indie+Flower&family=Ma+Shan+Zheng&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background-color: #fffaf0;
            background-image:
                linear-gradient(#d0e8f8 1px, transparent 1px),
                linear-gradient(90deg, #d0e8f8 1px, transparent 1px);
            background-size: 25px 25px;
            min-height: 100vh;
            font-family: 'Indie Flower', 'Ma Shan Zheng', cursive;
            padding: 80px 40px 40px;
        }
 /* Back 按钮样式 */
        .back-btn {
            position: fixed;
            top: 20px;
            right: 20px;
            font-size: 1.1rem;
            color: #333;
            text-decoration: none;
            background: #fff2cc;
            padding: 8px 16px;
            border-radius: 8px;
            box-shadow: 2px 2px 0 rgba(0,0,0,0.8), 3px 3px 10px rgba(0,0,0,0.2);
            transition: transform 0.2s;
            z-index: 100;
            font-family: "Comic Sans MS", "Marker Felt", cursive;
            cursor: pointer;
        }

        .back-btn:hover {
            transform: scale(1.1);
        }

        /* 标题 */
        h1 {
            text-align: center;
            font-size: clamp(1.8rem, 5vw, 3rem);
            margin-bottom: 30px;
            color: #333;
            text-shadow: 2px 2px 0 rgba(0,0,0,0.1);
        }

        /* 照片墙容器 */
        .gallery {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 15px;
            max-width: 1100px;
            margin: 0 auto;
            height: auto;
            max-height: 70vh;
            overflow-y: auto;
            overflow-x: hidden;
            padding: 20px;
        }

        /* 平板：3列 */
        @media (min-width: 600px) {
            .gallery {
                grid-template-columns: repeat(3, 1fr);
                gap: 20px;
            }
        }

        /* 电脑：5列 */
        @media (min-width: 1024px) {
            .gallery {
                grid-template-columns: repeat(5, 1fr);
                gap: 25px;
                height: 620px;
            }
        }

        /* 自定义滚动条 */
        .gallery::-webkit-scrollbar {
            width: 8px;
        }
        .gallery::-webkit-scrollbar-track {
            background: rgba(0,0,0,0.1);
            border-radius: 4px;
        }
        .gallery::-webkit-scrollbar-thumb {
            background: #d0e8f8;
            border-radius: 4px;
        }

        /* 照片项目 */
        .photo-item {
            position: relative;
            width: 100%;
            height: auto;
            aspect-ratio: 3/4;
            cursor: pointer;
        }

        /* 红色圆形贴纸 */
        .sticker {
            position: absolute;
            top: -8px;
            left: 50%;
            transform: translateX(-50%);
            width: 18px;
            height: 18px;
            background: #e74c3c;
            border-radius: 50%;
            z-index: 10;
            box-shadow: 1px 1px 3px rgba(0,0,0,0.3);
            opacity: 0.9;
        }

        .sticker::after {
            content: '';
            position: absolute;
            top: 3px;
            left: 4px;
            width: 4px;
            height: 4px;
            background: rgba(255,255,255,0.4);
            border-radius: 50%;
        }

        /* 照片容器 */
        .photo-wrapper {
            width: 100%;
            height: 100%;
            background: white;
            padding: 8px 8px 35px 8px;
            box-shadow: 2px 2px 0 rgba(0,0,0,0.4), 4px 4px 8px rgba(0,0,0,0.1);
            transform: rotate(var(--rotation));
            transition: all 0.5s cubic-bezier(0.4, 0, 0.2, 1);
            position: relative;
        }

        /* 随机旋转 */
        .photo-item:nth-child(5n+1) { --rotation: -3deg; }
        .photo-item:nth-child(5n+2) { --rotation: 2deg; }
        .photo-item:nth-child(5n+3) { --rotation: -2deg; }
        .photo-item:nth-child(5n+4) { --rotation: 3deg; }
        .photo-item:nth-child(5n+5) { --rotation: -1deg; }

        .photo-wrapper img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
        }

        /* 照片下方文字 */
        .photo-caption {
            position: absolute;
            bottom: 10px;
            left: 0;
            right: 0;
            text-align: center;
            font-size: clamp(0.7rem, 2vw, 0.85rem);
            color: #000;
            font-family: 'Ma Shan Zheng', 'Indie Flower', cursive;
            padding: 0 5px;
            opacity: 0.6;
        }

        /* ===== 点击放大效果 ===== */
        .photo-item.active {
            z-index: 1000;
        }

        .photo-item.active .photo-wrapper {
            position: fixed;
            top: 50%;
            left: 50%;
            width: min(350px, 90vw);
            height: auto;
            aspect-ratio: 3/4;
            transform: translate(-50%, -50%) rotate(0deg) scale(1);
            box-shadow: 0 0 0 1800px rgba(255,250,240,0.95), 0 20px 50px rgba(0,0,0,0.2);
            padding: 12px 12px 50px 12px;
        }

        .photo-item.active .sticker {
            position: fixed;
            top: calc(50% - min(175px, 45vw) - 10px);
            left: 50%;
            transform: translateX(-50%) scale(0.7);
            width: 18px;
            height: 18px;
        }

        .photo-item.active .photo-caption {
            position: fixed;
            bottom: calc(50% - min(175px, 45vw) - 40px);
            left: 50%;
            transform: translateX(-50%);
            font-size: clamp(1rem, 3vw, 1.3rem);
            opacity: 1;
            color: #000;
            z-index: 1001;
            width: 90vw;
            max-width: 300px;
        }

        /* 点击其他地方关闭 */
        .overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: transparent;
            z-index: 999;
            display: none;
        }

        .overlay.active {
            display: block;
        }
    </style>
</head>

    <script>
        function openPhoto(item) {
            // 关闭其他的
            closeAll();
            // 打开点击的
            item.classList.add('active');
            document.querySelector('.overlay').classList.add('active');
        }

        function closeAll() {
            document.querySelectorAll('.photo-item').forEach(item => {
                item.classList.remove('active');
            });
            document.querySelector('.overlay').classList.remove('active');
        }

        // ESC键关闭
        document.addEventListener('keydown', function(e) {
            if (e.key === 'Escape') closeAll();
        });
