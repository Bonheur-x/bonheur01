<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>pet-Bonheur-x</title>

    <!-- 引入萌趣圆体 -->
    <link href="https://fonts.googleapis.com/css2?family=M+PLUS+Rounded+1c:wght@800&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Indie+Flower&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Bangers&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            /* 背景：象牙白 + 淡蓝网格 */
            background-color: #fffaf0;
            background-image:
                linear-gradient(#d0e8f8 1px, transparent 1px),
                linear-gradient(90deg, #d0e8f8 1px, transparent 1px);
            background-size: 25px 25px;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 20px;
            font-family: "Comic Sans MS", "Marker Felt", cursive;
        }

        .title-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 10px;
            margin-bottom: 40px;
        }

        .title-row {
            display: flex;
            justify-content: center;
            gap: 2px;
            flex-wrap: wrap;
        }

        .letter {
            font-size: clamp(40px, 12vw, 110px);
            font-weight: bold;
            display: inline-block;
            animation: floatWobble 3s ease-in-out infinite;
            -webkit-text-stroke: 2px black;
            text-shadow: 
                2px 2px 0 #000,
                -2px -2px 0 #000,
                2px -2px 0 #000,
                -2px 2px 0 #000;
        }

        @keyframes floatWobble {
            0%   { transform: translateY(0px) rotate(0deg); }
            25%  { transform: translateY(-8px) rotate(2deg); }
            50%  { transform: translateY(0px) rotate(0deg); }
            75%  { transform: translateY(-8px) rotate(-2deg); }
            100% { transform: translateY(0px) rotate(0deg); }
        }

        /* 字母颜色 */
        .c1 { color: #FF5959; }
        .c2 { color: #4A90E2; }
        .c3 { color: #52B788; }
        .c4 { color: #F5A623; }
        .c5 { color: #9013FE; }
        .c6 { color: #FF69B4; }
        .c7 { color: #00CED1; }

        .space {
            width: clamp(10px, 3vw, 20px);
        }

        /* 纸条容器 - 改为垂直排列在标题下方 */
        .notes-container {
            display: flex;
            flex-direction: column;
            gap: 20px;
            align-items: center;
            width: 100%;
            max-width: 400px;
        }

        .paper-note {
            width: min(290px, 85vw);
            height: 70px;
            position: relative;
            background: transparent;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: 'Indie Flower', 'Comic Sans MS', cursive;
            font-size: clamp(1.5rem, 5vw, 2rem);
            font-weight: bold;
            color: #333;
            cursor: pointer;
            transition: transform 0.2s ease;
            filter: drop-shadow(3px 3px 0px rgba(0,0,0,0.5)) drop-shadow(6px 6px 10px rgba(0,0,0,0.2));
        }

        .paper-note::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: #fff2cc;
            z-index: -1;
            clip-path: polygon(
                0% 0%,
                100% 0%,
                100% 15%, 95% 30%, 100% 45%, 95% 60%, 100% 75%, 95% 90%, 100% 100%,
                0% 100%,
                0% 85%, 5% 70%, 0% 55%, 5% 40%, 0% 25%, 5% 10%, 0% 0%
            );
        }

        .paper-note:hover {
            transform: scale(1.1);
            filter: drop-shadow(4px 4px 0px rgba(0,0,0,0.4)) drop-shadow(8px 8px 12px rgba(0,0,0,0.25));
        }

        /* 平板和电脑端：横向布局 */
        @media (min-width: 768px) {
            body {
                flex-direction: row;
                justify-content: center;
                gap: 5vw;
                padding: 40px;
            }

            .title-container {
                margin-bottom: 0;
                padding-right: 0;
            }

            .notes-container {
                position: static;
                transform: none;
                width: auto;
            }

            .paper-note:hover {
                transform: scale(1.3);
            }
        }

        /* 大屏幕：纸条放右边 */
        @media (min-width: 1024px) {
            body {
                justify-content: flex-start;
                padding-left: 10vw;
                gap: 10vw;
            }

            .notes-container {
                position: fixed;
                right: 13vw;
                top: 50%;
                transform: translateY(-50%);
                width: 290px;
            }
        }
    </style>
</head>
<body>
    <div class="title-container">
        <!-- welcome -->
        <div class="title-row">
            <span class="letter c1" style="animation-delay: 0s;">W</span>
            <span class="letter c2" style="animation-delay: 0.4s;">E</span>
            <span class="letter c3" style="animation-delay: 0.1s;">L</span>
            <span class="letter c4" style="animation-delay: 0.5s;">C</span>
            <span class="letter c5" style="animation-delay: 0.2s;">O</span>
            <span class="letter c6" style="animation-delay: 0.6s;">M</span>
            <span class="letter c7" style="animation-delay: 0.3s;">E</span>
        </div>

        <!-- to -->
        <div class="title-row">
            <span class="letter c1" style="animation-delay: 0.1s;">T</span>
            <span class="letter c2" style="animation-delay: 0.5s;">O</span>
        </div>

        <!-- my moment -->
        <div class="title-row">
            <span class="letter c3" style="animation-delay: 0.2s;">M</span>
            <span class="letter c4" style="animation-delay: 0.6s;">Y</span>
            <span class="space"></span>
            <span class="letter c5" style="animation-delay: 0s;">M</span>
            <span class="letter c6" style="animation-delay: 0.4s;">O</span>
            <span class="letter c1" style="animation-delay: 0.1s;">M</span>
            <span class="letter c2" style="animation-delay: 0.5s;">E</span>
            <span class="letter c3" style="animation-delay: 0.3s;">N</span>
            <span class="letter c4" style="animation-delay: 0.7s;">T</span>
        </div>
    </div>

    <div class="notes-container">
        <a href="portrairt.html" style="text-decoration: none;">
            <div class="paper-note">
                <span>Portrait👑</span>
            </div>
        </a>
        <a href="food.html" style="text-decoration: none;">
            <div class="paper-note">
                <span>Food🍽️</span>
            </div>
        </a>
        <a href="scenery.html" style="text-decoration: none;">
            <div class="paper-note">
                <span>Scenery✈️</span>
            </div>
        </a>
        <a href="pet.html" style="text-decoration: none;">
            <div class="paper-note">
                <span>Pet🐿️</span>
            </div>
        </a>
    </div>
</body>
</html>
